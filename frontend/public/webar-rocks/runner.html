<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Goldar WebAR Ring Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#181818;color:#eee;font-family:system-ui}
#canvases{position:absolute;inset:0;overflow:hidden}
#canvases canvas{position:absolute;inset:0;width:100%;height:100%}
#handTrackerCanvas{z-index:1}#VTOCanvas{z-index:2;pointer-events:none}
#loading{z-index:10;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#151515;text-align:center;padding:20px}
#instructions{z-index:9;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;text-align:center;padding:20px}
#instructions>div{max-width:340px}#instructions button{margin-top:16px;background:#c4a16c;border:0;padding:12px 26px}
#controls{z-index:3;position:absolute;bottom:8px;left:8px;right:8px;display:none;gap:8px;flex-wrap:wrap}
#controls>div{background:#111c;color:#fff;border:1px solid #a78c5f;border-radius:6px;padding:9px;cursor:pointer;font-size:12px}
#loading.error{background:#4a1919}
</style>
<script>
const q=new URLSearchParams(location.search);
const glb=q.get("glb")||"";
if(!/^https:\/\//.test(glb))document.documentElement.dataset.error="A public HTTPS GLB URL is required";
window.GOLDAR_GLB_URL=glb;
window.GOLDAR_SCALE=Math.max(0.05,Math.min(100,Number(q.get("scale"))||25));
window.GOLDAR_OFFSET_X=Math.max(-30,Math.min(30,Number(q.get("x"))||-1.66));
window.GOLDAR_OFFSET_Y=Math.max(-30,Math.min(30,Number(q.get("y"))||-11.91));
window.GOLDAR_OFFSET_Z=Math.max(-30,Math.min(30,Number(q.get("z"))||0.26));
window.addEventListener("error",ev=>{const el=document.getElementById("loading");if(el){const src=ev.filename||ev.target?.src||"unknown";el.textContent="WebAR engine error: "+(ev.message||"Resource load failed")+" ("+src+")";el.className="error"}} ,true);
window.addEventListener("unhandledrejection",ev=>{const el=document.getElementById("loading");if(el){el.textContent="AR initialization failed: "+String(ev.reason);el.className="error"}});
</script>
<script src="/webar-rocks/vendor/WebARRocksHand.js"></script>
<script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r131/three.min.js"></script>
<script src="/webar-rocks/vendor/GLTFLoader.js"></script>
<script src="/webar-rocks/vendor/HandTrackerThreeHelper.js"></script>
<script src="/webar-rocks/vendor/OneEuroLMStabilizer.js"></script>
<script src="/webar-rocks/vendor/PoseFlipFilter.js"></script>
<script src="./goldar-main.js"></script></head>
<body><div id="loading">INITIALIZING WEBAR.ROCKS…</div>
<div id="instructions"><div>Keep your hand upright and fully visible.<br>For this test, show the back of your hand toward the camera.<br><button onclick="hide_instructions()">START FITTING</button></div></div>
<div id="canvases"><canvas id="VTOCanvas"></canvas><canvas id="handTrackerCanvas"></canvas></div>
<div id="controls"><div onclick="flip_camera()">SWITCH CAMERA</div><div onclick="load_model('ringDemo')">PALM TRACKER</div><div onclick="load_model('ringBackDemo')">BACK TRACKER</div></div>
</body></html>
